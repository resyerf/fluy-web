<app-modal-shell
  title="Nuevo usuario"
  [closeDisabled]="saving()"
  [errorMessage]="errorMessage()"
  (closed)="cancel()"
>
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput name="email" type="email" [(ngModel)]="email" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Nombre completo</mat-label>
    <input matInput name="fullName" [(ngModel)]="fullName" />
  </mat-form-field>

  <div modalFooter>
    <button mat-button [disabled]="saving()" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="saving()" (click)="submit()">
      @if (saving()) {
        <mat-spinner diameter="18" />
      } @else {
        Crear usuario
      }
    </button>
  </div>
</app-modal-shell>
