<h2 mat-dialog-title>Nuevo usuario</h2>

<div mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput name="email" [(ngModel)]="email" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Nombre completo</mat-label>
    <input matInput name="fullName" [(ngModel)]="fullName" />
  </mat-form-field>
  @if (errorMessage(); as error) {
    <p class="error">{{ error }}</p>
  }
</div>

<div mat-dialog-actions align="end">
  <button mat-button [disabled]="saving()" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="saving()" (click)="submit()">
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      Crear usuario
    }
  </button>
</div>
