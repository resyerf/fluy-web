<app-modal-shell
  title="Nuevo rol"
  [closeDisabled]="saving()"
  [errorMessage]="errorMessage()"
  (closed)="cancel()"
>
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput name="name" [(ngModel)]="name" />
  </mat-form-field>

  <div class="permissions">
    <p class="permissions-label">Permisos</p>
    @for (group of groups; track group.label) {
      <div class="permission-group">
        <span class="permission-group-label">{{ group.label }}</span>
        @for (permission of group.items; track permission.id) {
          <label class="permission-row">
            <mat-checkbox [(ngModel)]="selectedPermissions[permission.code]" [name]="permission.code" />
            <span class="permission-text">
              <span class="permission-description">{{ permission.description }}</span>
              <code class="permission-code">{{ permission.code }}</code>
            </span>
          </label>
        }
      </div>
    }
  </div>

  <div modalFooter>
    <button mat-button [disabled]="saving()" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="saving()" (click)="submit()">
      @if (saving()) {
        <mat-spinner diameter="18" />
      } @else {
        Crear rol
      }
    </button>
  </div>
</app-modal-shell>
