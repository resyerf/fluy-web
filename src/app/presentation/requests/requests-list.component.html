<h2>Mis solicitudes</h2>

@if (loading()) {
  <mat-spinner diameter="32" />
} @else if (requests().length === 0) {
  <p>
    No tienes solicitudes todavía.
    <a mat-button color="primary" routerLink="/requests/new">Crear una</a>
  </p>
} @else {
  <div class="table-scroll">
    <table mat-table [dataSource]="requests()">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let request">
          <a [routerLink]="['/requests', request.id]">{{ request.title }}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let request">{{ request.amount ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let request">
          <span class="signal" [class]="signalByStatus[request.status]">{{ request.status }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="submittedAt">
        <th mat-header-cell *matHeaderCellDef>Enviada</th>
        <td mat-cell *matCellDef="let request">{{ request.submittedAt ?? '—' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
}
