<div class="wrap">
  <h2>Seleccioná una sede</h2>

  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="32" />
    </div>
  } @else {
    <div class="branch-grid">
      @for (branch of branches(); track branch.id) {
        <button class="branch-card" [class.is-current]="branch.id === currentBranchId" (click)="select(branch)">
          <span class="branch-name">{{ branch.name }}</span>
          @if (branch.id === currentBranchId) {
            <span class="signal is-go">Actual</span>
          }
        </button>
      }
    </div>
  }
</div>
