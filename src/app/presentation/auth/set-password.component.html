<div class="auth-shell">
  <aside class="auth-brand">
    <span class="brand-mark">FLUY</span>
    <p class="brand-line">Un último paso antes de entrar a tu vía de aprobación.</p>
  </aside>

  <section class="auth-panel">
    <div class="auth-form-wrap">
      <h1>Definí tu contraseña</h1>

      @if (!tokenPresent) {
        <p class="error">Este link no incluye un token válido — pedí que te reenvíen el email de activación.</p>
      } @else {
        <form (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>Nueva contraseña</mat-label>
            <input matInput name="newPassword" type="password" [(ngModel)]="newPassword" required />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Confirmar contraseña</mat-label>
            <input matInput name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required />
          </mat-form-field>

          @if (errorMessage(); as error) {
            <p class="error">{{ error }}</p>
          }

          <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="submit-button">
            @if (loading()) {
              <mat-spinner diameter="20" />
            } @else {
              Activar cuenta
            }
          </button>
        </form>
      }
    </div>
  </section>
</div>
