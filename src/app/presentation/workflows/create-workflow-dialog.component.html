<app-modal-shell title="Nuevo workflow" icon="route" [closeDisabled]="saving()" (closed)="cancel()">
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput name="name" [(ngModel)]="name" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <input matInput name="description" [(ngModel)]="description" />
  </mat-form-field>
  @if (errorMessage(); as error) {
    <p class="error">{{ error }}</p>
  }

  <div modalFooter>
    <button mat-button [disabled]="saving()" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="saving() || !name" (click)="submit()">
      @if (saving()) {
        <mat-spinner diameter="18" />
      } @else {
        Crear workflow
      }
    </button>
  </div>
</app-modal-shell>
