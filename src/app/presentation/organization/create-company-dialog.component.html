<app-modal-shell
  title="Nueva empresa"
  [closeDisabled]="saving()"
  [errorMessage]="errorMessage()"
  (closed)="cancel()"
>
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput name="name" [(ngModel)]="name" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Identificador legal (opcional)</mat-label>
    <input matInput name="legalIdentifier" [(ngModel)]="legalIdentifier" />
  </mat-form-field>

  <div modalFooter>
    <button mat-button [disabled]="saving()" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="saving()" (click)="submit()">
      @if (saving()) {
        <mat-spinner diameter="18" />
      } @else {
        Crear empresa
      }
    </button>
  </div>
</app-modal-shell>
